name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q AlightMotionMasterAI.zip
          ls AlightMotionMasterAI

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # إعادة المحاولة تلقائياً عند أخطاء الشبكة (مثل 429 من Maven Central)
      - name: Build debug APK (with retry)
        working-directory: AlightMotionMasterAI
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            if gradle --no-daemon --stacktrace :app:assembleDebug; then
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep $((i * 60))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlightMotionMasterAI-debug-apk
          path: AlightMotionMasterAI/app/build/outputs/apk/debug/*.apk

      - name: Validate knowledge base
        continue-on-error: true
        working-directory: AlightMotionMasterAI
        run: python3 tools/validate_kb.py

      - name: Unit tests
        continue-on-error: true
        working-directory: AlightMotionMasterAI
        run: gradle --no-daemon test
